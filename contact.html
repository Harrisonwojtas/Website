<div class="container">
  <h1>Contact Me</h1>
  <p>If you'd like to reach out to inquire about a piece, comission, talk shop, or just say hello, there is a form below.</p>

  <!--
    This form uses Formspree (https://formspree.io) so it works on GitHub Pages
    without a server. To activate it:
      1. Sign up at formspree.io (free tier is fine)
      2. Create a new form, copy the form ID it gives you
      3. Replace YOUR_FORM_ID below with that ID
    Until then, submissions will not go anywhere.
  -->
  <form class="contact-form" action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
    <label for="name">Name</label>
    <input type="text" id="name" name="name" required>

    <label for="email">Email</label>
    <input type="email" id="email" name="_replyto" required>

    <label for="message">Message</label>
    <textarea id="message" name="message" rows="6" required></textarea>

    <button type="submit">Send</button>
  </form>
  <p class="form-note">Powered by Formspree — replies go straight to your inbox.</p>
</div>
