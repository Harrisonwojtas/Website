<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} - Harry Wojtas{% else %}Harry Wojtas{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">

  <!-- Social sharing preview -->
  <meta property="og:title" content="{% if page.title %}{{ page.title }} - Harry Wojtas{% else %}Harry Wojtas{% endif %}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:type" content="website">

  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  {% if page.extra_css %}<style>{{ page.extra_css }}</style>{% endif %}
</head>
<body{% if page.bg_color %} style="background-color: {{ page.bg_color }};"{% endif %}>
  {% include nav.html %}

  {{ content }}

  {% include footer.html %}

  {% if page.gallery %}
  <script src="{{ '/assets/js/lightbox.js' | relative_url }}"></script>
  {% endif %}
</body>
</html>
